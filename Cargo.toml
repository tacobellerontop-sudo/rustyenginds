[package]
name = "rusty-wallpaper"
version = "0.1.0"
edition = "2021"
description = "A lightweight animated wallpaper engine written in Rust"
license = "MIT"
default-run = "rusty-wallpaper"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
dirs = "6"
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif"] }
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
rayon = "1"
serde = { version = "1", features = ["derive"] }
softbuffer = "0.4"
toml = "0.9"
winit = "0.30"

[build-dependencies]
embed-manifest = "1.5"

[target.'cfg(windows)'.dependencies]
rfd = "0.17"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = "thin"
codegen-units = 1

# Pixel shading is hot even in debug builds; keep dependencies (and us) reasonably fast.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
