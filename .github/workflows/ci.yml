name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --release
      - run: cargo build --release
      - name: Package with ffmpeg
        shell: pwsh
        run: |
          # LGPL build of FFmpeg, used for video wallpapers.
          Invoke-WebRequest -Uri https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl.zip -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item target/release/rusty-wallpaper.exe dist/
          Copy-Item (Get-ChildItem ffmpeg -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName dist/
          Copy-Item (Get-ChildItem ffmpeg -Recurse -Filter LICENSE.txt | Select-Object -First 1).FullName dist/FFMPEG-LICENSE.txt
          Copy-Item examples/config.toml dist/
          ./dist/ffmpeg.exe -version | Select-Object -First 1
      - uses: actions/upload-artifact@v4
        with:
          name: rusty-wallpaper-windows-x64
          path: dist/

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --release
